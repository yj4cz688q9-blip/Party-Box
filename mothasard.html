    <title>Mot Hasard - Party Box</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d0d0d; color: white; font-family: Arial, sans-serif; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; overflow-y: auto; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; min-height: 100vh; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: 36px; color: #ff9500; margin-bottom: 5px; margin-top: 20px; }
        .subtitle { font-size: 15px; color: #888; margin-bottom: 25px; }
        .start-btn { background-color: #ff9500; color: white; border: none; border-radius: 20px; padding: 18px 40px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; max-width: 340px; }
        .back-btn { background: none; border: none; color: #888; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .section-title { font-size: 13px; color: #ff9500; text-transform: uppercase; letter-spacing: 1px; text-align: left; width: 100%; max-width: 340px; margin: 15px 0 8px; }

        /* CATÉGORIES */
        .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; }
        .cat-btn { background-color: #1a1a1a; border: 2px solid #333; border-radius: 14px; padding: 14px 10px; color: white; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s; }
        .cat-btn.selected { border-color: #ff9500; color: #ff9500; background-color: #2a1500; }
        .cat-emoji { font-size: 26px; }
        .tout-btn { background-color: #1a1a1a; border: 2px solid #333; border-radius: 14px; padding: 12px; width: 100%; max-width: 340px; color: white; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
        .tout-btn.selected { border-color: #ff9500; color: #ff9500; background-color: #2a1500; }

        /* MOT */
        .mot-card { background: linear-gradient(135deg, #1a1a1a, #2a1500); border: 2px solid #ff9500; border-radius: 24px; padding: 50px 30px; width: 100%; max-width: 340px; margin: 20px 0; }
        .mot-texte { font-size: 38px; font-weight: bold; color: white; margin-bottom: 10px; }
        .mot-categorie { font-size: 14px; color: #ff9500; }
        .compteur { font-size: 13px; color: #888; margin-bottom: 15px; }
        .progress-bg { width: 100%; max-width: 340px; height: 6px; background: #1a1a1a; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: #ff9500; border-radius: 3px; transition: width 0.3s; }
    </style>

<body>

    <!-- CONFIG -->
    <div class="screen active" id="screen-config">
        <h1>🎲 Mot Hasard</h1>
        <p class="subtitle">Tire un mot aléatoire !</p>

        <p class="section-title">📚 Catégories</p>
        <button class="tout-btn" id="btn-tout" onclick="toggleTout()">🎲 Tout mélanger</button>
        <div class="cat-grid" id="cat-grid"></div>

        <button class="start-btn" onclick="lancerJeu()">C'est parti ! 🎲</button>
        <button class="back-btn" onclick="window.location.href='index.html'">← Retour</button>
    </div>

    <!-- JEU -->
    <div class="screen" id="screen-jeu">
        <h1>🎲 Mot Hasard</h1>
        <p class="compteur" id="compteur">0 mots restants</p>
        <div class="progress-bg"><div class="progress-fill" id="progress"></div></div>
        <div class="mot-card">
            <div class="mot-texte" id="mot-texte">?</div>
            <div class="mot-categorie" id="mot-categorie"></div>
        </div>
        <button class="start-btn" onclick="motSuivant()">Mot suivant 🎲</button>
        <button class="back-btn" onclick="showScreen('screen-config')">← Changer les catégories</button>
    </div>

    <!-- FIN -->

        let motsDispo = []
        let totalMots = 0
        let categoriesSelectionnees = []
        let toutSelectionne = false

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
            document.getElementById(id).classList.add('active')
        }

        function renderCategories() {
            const grid = document.getElementById('cat-grid')
            grid.innerHTML = ''
            Object.entries(CATEGORIES).forEach(([key, cat]) => {
                const btn = document.createElement('button')
                btn.className = 'cat-btn'
                btn.id = 'cat-' + key
                btn.innerHTML = `<span class="cat-emoji">${cat.emoji}</span>${cat.nom}`
                btn.onclick = () => toggleCat(key, btn)
                grid.appendChild(btn)
            })
        }

        function toggleCat(key, btn) {
            toutSelectionne = false
            document.getElementById('btn-tout').classList.remove('selected')
            if (categoriesSelectionnees.includes(key)) {
                categoriesSelectionnees = categoriesSelectionnees.filter(k => k !== key)
                btn.classList.remove('selected')
            } else {
                categoriesSelectionnees.push(key)
                btn.classList.add('selected')
            }
        }

        function toggleTout() {
            toutSelectionne = !toutSelectionne
            categoriesSelectionnees = []
            document.getElementById('btn-tout').classList.toggle('selected', toutSelectionne)
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'))
        }

        function lancerJeu() {
            const cats = toutSelectionne ? Object.keys(CATEGORIES) : categoriesSelectionnees
            if (cats.length === 0) { alert('Sélectionne au moins une catégorie !'); return; }
            motsDispo = []
            cats.forEach(key => {
                CATEGORIES[key].mots.forEach(mot => {
                    motsDispo.push({ mot, categorie: CATEGORIES[key].emoji + ' ' + CATEGORIES[key].nom })
                })
            })
            motsDispo = motsDispo.sort(() => Math.random() - 0.5)
            totalMots = motsDispo.length
            showScreen('screen-jeu')
            motSuivant()
        }

        function motSuivant() {
            if (motsDispo.length === 0) { showScreen('screen-fin'); return; }
            const item = motsDispo.pop()
            document.getElementById('mot-texte').textContent = item.mot
            document.getElementById('mot-categorie').textContent = item.categorie
            document.getElementById('compteur').textContent = motsDispo.length + ' mots restants'
            const pct = ((totalMots - motsDispo.length) / totalMots * 100)
            document.getElementById('progress').style.width = pct + '%'
        }

        function relancer() {
            lancerJeu()
        }

        renderCategories()
    </script>
</body>
</html>
