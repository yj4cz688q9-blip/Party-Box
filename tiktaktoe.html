<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="icon" type="image/png" href="F1CE1FF7-8FC2-440D-8100-49C689144B20.png">
    <link rel="apple-touch-icon" href="F1CE1FF7-8FC2-440D-8100-49C689144B20.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d0d0d; color: white; font-family: Arial, sans-serif; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; overflow-y: auto; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; min-height: 100vh; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: 38px; color: #00e5cc; margin-bottom: 10px; margin-top: 20px; }
        .subtitle { font-size: 15px; color: #888; margin-bottom: 25px; }
        .start-btn { background-color: #00e5cc; color: #0d0d0d; border: none; border-radius: 20px; padding: 18px 40px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; max-width: 340px; }
        .back-btn { background: none; border: none; color: #888; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; margin-bottom: 20px; }
        .mode-btn { background-color: #1a1a1a; border: 2px solid #333; border-radius: 14px; color: white; padding: 15px 8px; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .mode-btn.selected { border-color: #00e5cc; color: #00e5cc; }
        .mode-emoji { font-size: 24px; }
        .player-input { background-color: #1a1a1a; border: 2px solid #333; border-radius: 12px; padding: 12px 16px; color: white; font-size: 16px; width: 100%; max-width: 340px; margin: 6px 0; }
        .player-input:focus { border-color: #00e5cc; outline: none; }
        .diff-options { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .diff-btn { background-color: #1a1a1a; border: 2px solid #333; border-radius: 12px; color: white; padding: 10px 16px; font-size: 14px; cursor: pointer; }
        .diff-btn.selected { border-color: #00e5cc; color: #00e5cc; font-weight: bold; }
        .section-title { font-size: 13px; color: #00e5cc; text-transform: uppercase; letter-spacing: 1px; text-align: left; width: 100%; max-width: 340px; margin: 12px 0 6px; }

        /* SCORE */
        .score-box { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .score-item { background-color: #1a1a1a; border-radius: 14px; padding: 12px 16px; min-width: 70px; }
        .score-nom { font-size: 11px; color: #888; margin-bottom: 4px; }
        .score-pts { font-size: 24px; font-weight: bold; }
        .score-item.j1 .score-pts { color: #00e5cc; }
        .score-item.j2 .score-pts { color: #ff6b6b; }
        .score-item.j3 .score-pts { color: #ffd166; }
        .score-item.nul .score-pts { color: #888; }

        /* TOUR */
        .tour-info { font-size: 18px; font-weight: bold; color: #00e5cc; margin-bottom: 15px; }

        /* GRILLE 3x3 */
        .grille-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; margin-bottom: 20px; }
        .cell-3 { background-color: #1a1a1a; border: 2px solid #333; border-radius: 14px; aspect-ratio: 1; font-size: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 0.2s; }
        .cell-3:active { background-color: #2a2a2a; }
        .cell-3.j1 { border-color: #00e5cc; }
        .cell-3.j2 { border-color: #ff6b6b; }
        .cell-3.gagnante { background-color: #003d2e; }

        /* GRILLE 8x8 */
        .grille-8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 100%; max-width: 360px; margin-bottom: 20px; }
        .cell-8 { background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; aspect-ratio: 1; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 0.2s; }
        .cell-8:active { background-color: #2a2a2a; }
        .cell-8.j1 { border-color: #00e5cc; }
        .cell-8.j2 { border-color: #ff6b6b; }
        .cell-8.j3 { border-color: #ffd166; }
        .cell-8.gagnante { background-color: #1a2a00; border-color: #00ff44; }

        .rejouer-btn { background-color: #1a1a1a; border: 2px solid #00e5cc; color: #00e5cc; border-radius: 20px; padding: 14px 30px; font-size: 16px; cursor: pointer; margin-top: 10px; width: 100%; max-width: 340px; }
        .info-align { font-size: 12px; color: #555; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- ACCUEIL -->
    <div class="screen active" id="screen-home">
        <h1>❌⭕ Tic Tac Toe</h1>
        <p class="subtitle">Classique ou 3 joueurs !</p>

        <p class="section-title">🎮 Mode de jeu</p>
        <div class="mode-grid">
            <button class="mode-btn selected" id="mode-local" onclick="selectMode('local')">
                <span class="mode-emoji">👥</span>2 Joueurs
            </button>
            <button class="mode-btn" id="mode-3j" onclick="selectMode('3j')">
                <span class="mode-emoji">👥👤</span>3 Joueurs
            </button>
            <button class="mode-btn" id="mode-solo" onclick="selectMode('solo')">
                <span class="mode-emoji">🤖</span>vs Bot
            </button>
        </div>

        <!-- CONFIG 2 JOUEURS -->
        <div id="config-local">
            <input class="player-input" id="nom-j1" placeholder="❌ Joueur 1">
            <input class="player-input" id="nom-j2" placeholder="⭕ Joueur 2">
        </div>

        <!-- CONFIG 3 JOUEURS -->
        <div id="config-3j" style="display:none">
            <input class="player-input" id="nom-3j1" placeholder="❌ Joueur 1">
            <input class="player-input" id="nom-3j2" placeholder="⭕ Joueur 2">
            <input class="player-input" id="nom-3j3" placeholder="🔺 Joueur 3">
        </div>

        <!-- CONFIG BOT -->
        <div id="config-solo" style="display:none">
            <input class="player-input" id="nom-solo" placeholder="❌ Ton nom">
            <p style="color:#888;font-size:14px;margin-top:15px">Difficulté</p>
            <div class="diff-options">
                <button class="diff-btn" onclick="selectDiff('facile',this)">😴 Facile</button>
                <button class="diff-btn selected" onclick="selectDiff('normal',this)">😐 Normal</button>
                <button class="diff-btn" onclick="selectDiff('expert',this)">🔥 Expert</button>
            </div>
        </div>

        <button class="start-btn" onclick="startGame()" style="margin-top:25px">C'est parti ! 🚀</button>
        <button class="back-btn" onclick="window.location.href='index.html'">← Retour à Party Box</button>
    </div>

    <!-- JEU -->
    <div class="screen" id="screen-jeu">
        <div class="score-box" id="score-box"></div>
        <div class="tour-info" id="tour-info"></div>
        <p class="info-align" id="info-align"></p>
        <div id="grille-container"></div>
        <button class="rejouer-btn" onclick="resetGrille()">🔄 Rejouer</button>
        <button class="back-btn" onclick="showScreen('screen-home')">← Quitter</button>
    </div>

    <script>
        let modeJeu = 'local';
        let diffBot = 'normal';
        let plateau = [];
        let joueurCourant = 0;
        let scores = [0, 0, 0, 0];
        let noms = [];
        let symboles = ['❌', '⭕', '🔺'];
        let classes = ['j1', 'j2', 'j3'];
        let taille = 3;
        let alignement = 3;
        let partieTerminee = false;
        let nbJoueurs = 2;

        const COMBOS_3 = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectMode(mode) {
            modeJeu = mode;
            ['local','3j','solo'].forEach(m => document.getElementById('mode-'+m).classList.toggle('selected', m === mode));
            document.getElementById('config-local').style.display = mode === 'local' ? 'block' : 'none';
            document.getElementById('config-3j').style.display = mode === '3j' ? 'block' : 'none';
            document.getElementById('config-solo').style.display = mode === 'solo' ? 'block' : 'none';
        }

        function selectDiff(diff, btn) {
            diffBot = diff;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function startGame() {
            if (modeJeu === 'local') {
                nbJoueurs = 2; taille = 3; alignement = 3;
                noms = [
                    document.getElementById('nom-j1').value.trim() || 'Joueur 1',
                    document.getElementById('nom-j2').value.trim() || 'Joueur 2'
                ];
            } else if (modeJeu === '3j') {
                nbJoueurs = 3; taille = 8; alignement = 4;
                noms = [
                    document.getElementById('nom-3j1').value.trim() || 'Joueur 1',
                    document.getElementById('nom-3j2').value.trim() || 'Joueur 2',
                    document.getElementById('nom-3j3').value.trim() || 'Joueur 3'
                ];
            } else {
                nbJoueurs = 2; taille = 3; alignement = 3;
                noms = [
                    document.getElementById('nom-solo').value.trim() || 'Joueur',
                    '🤖 Bot'
                ];
            }
            scores = Array(nbJoueurs + 1).fill(0);
            renderScores();
            resetGrille();
            showScreen('screen-jeu');
        }

        function renderScores() {
            const box = document.getElementById('score-box');
            box.innerHTML = '';
            noms.forEach((nom, i) => {
                const div = document.createElement('div');
                div.className = 'score-item ' + classes[i];
                div.innerHTML = `<div class="score-nom">${symboles[i]} ${nom}</div><div class="score-pts" id="score-${i}">0</div>`;
                box.appendChild(div);
            });
            const nul = document.createElement('div');
            nul.className = 'score-item nul';
            nul.innerHTML = `<div class="score-nom">🤝 Nul</div><div class="score-pts" id="score-nul">0</div>`;
            box.appendChild(nul);
        }

        function resetGrille() {
            plateau = Array(taille * taille).fill(null);
            joueurCourant = 0;
            partieTerminee = false;
            renderGrille();
            majTourInfo();
            document.getElementById('info-align').textContent = modeJeu === '3j' ? '4 symboles à aligner pour gagner' : '';
        }

        function renderGrille() {
            const container = document.getElementById('grille-container');
            container.innerHTML = '';
            const grille = document.createElement('div');
            grille.className = taille === 3 ? 'grille-3' : 'grille-8';
            plateau.forEach((val, idx) => {
                const cell = document.createElement('div');
                cell.className = (taille === 3 ? 'cell-3' : 'cell-8') + (val !== null ? ' ' + classes[val] : '');
                cell.textContent = val !== null ? symboles[val] : '';
                cell.onclick = () => jouerCoup(idx);
                grille.appendChild(cell);
            });
            container.appendChild(grille);
        }

        function majTourInfo() {
            const info = document.getElementById('tour-info');
            info.textContent = 'Tour de ' + symboles[joueurCourant] + ' ' + noms[joueurCourant];
            info.style.color = joueurCourant === 0 ? '#00e5cc' : joueurCourant === 1 ? '#ff6b6b' : '#ffd166';
        }

        function jouerCoup(idx) {
            if (partieTerminee || plateau[idx] !== null) return;
            if (modeJeu === 'solo' && joueurCourant === 1) return;
            plateau[idx] = joueurCourant;
            renderGrille();
            const gagnant = verifierGagnant();
            if (gagnant !== null) { finPartie(gagnant); return; }
            if (plateau.every(c => c !== null)) { finPartie(-1); return; }
            joueurCourant = (joueurCourant + 1) % nbJoueurs;
            majTourInfo();
            if (modeJeu === 'solo' && joueurCourant === 1) setTimeout(jouerBot, 400);
        }

        function verifierGagnant() {
            const cells = document.querySelectorAll('.cell-3, .cell-8');
            if (taille === 3) {
                for (const combo of COMBOS_3) {
                    const [a, b, c] = combo;
                    if (plateau[a] !== null && plateau[a] === plateau[b] && plateau[a] === plateau[c]) {
                        combo.forEach(i => cells[i].classList.add('gagnante'));
                        return plateau[a];
                    }
                }
            } else {
                // Vérification 8x8 - 4 alignés
                const dirs = [[1,0],[0,1],[1,1],[1,-1]];
                for (let r = 0; r < taille; r++) {
                    for (let c = 0; c < taille; c++) {
                        const idx = r * taille + c;
                        if (plateau[idx] === null) continue;
                        for (const [dr, dc] of dirs) {
                            const combo = [];
                            for (let k = 0; k < alignement; k++) {
                                const nr = r + dr * k, nc = c + dc * k;
                                if (nr < 0 || nr >= taille || nc < 0 || nc >= taille) break;
                                const ni = nr * taille + nc;
                                if (plateau[ni] !== plateau[idx]) break;
                                combo.push(ni);
                            }
                            if (combo.length === alignement) {
                                combo.forEach(i => cells[i].classList.add('gagnante'));
                                return plateau[idx];
                            }
                        }
                    }
                }
            }
            return null;
        }

        function finPartie(gagnant) {
            partieTerminee = true;
            const info = document.getElementById('tour-info');
            if (gagnant === -1) {
                scores[nbJoueurs]++;
                document.getElementById('score-nul').textContent = scores[nbJoueurs];
                info.textContent = '🤝 Match nul !';
                info.style.color = '#888';
            } else {
                scores[gagnant]++;
                document.getElementById('score-' + gagnant).textContent = scores[gagnant];
                info.textContent = '🎉 ' + noms[gagnant] + ' gagne !';
                info.style.color = gagnant === 0 ? '#00e5cc' : gagnant === 1 ? '#ff6b6b' : '#ffd166';
            }
        }

        function jouerBot() {
            if (partieTerminee) return;
            let idx = -1;
            if (diffBot === 'facile') {
                const libres = plateau.map((v,i) => v === null ? i : -1).filter(i => i !== -1);
                idx = libres[Math.floor(Math.random() * libres.length)];
            } else if (diffBot === 'normal') {
                idx = trouverCoupGagnant(1) ?? trouverCoupGagnant(0) ?? coupAleatoire();
            } else {
                idx = minimax(plateau, 1).idx;
            }
            if (idx !== -1 && idx !== undefined) {
                plateau[idx] = 1;
                renderGrille();
                const gagnant = verifierGagnant();
                if (gagnant !== null) { finPartie(gagnant); return; }
                if (plateau.every(c => c !== null)) { finPartie(-1); return; }
                joueurCourant = 0;
                majTourInfo();
            }
        }

        function trouverCoupGagnant(joueur) {
            for (const combo of COMBOS_3) {
                const vals = combo.map(i => plateau[i]);
                if (vals.filter(v => v === joueur).length === 2 && vals.includes(null)) {
                    return combo[vals.indexOf(null)];
                }
            }
            return null;
        }

        function coupAleatoire() {
            const libres = plateau.map((v,i) => v === null ? i : -1).filter(i => i !== -1);
            if (plateau[4] === null) return 4;
            return libres[Math.floor(Math.random() * libres.length)];
        }

        function minimax(board, joueur) {
            const gagnant = verifierGagnantBoard(board);
            if (gagnant === 1) return { score: 10 };
            if (gagnant === 0) return { score: -10 };
            if (board.every(c => c !== null)) return { score: 0 };
            const moves = [];
            board.forEach((val, idx) => {
                if (val !== null) return;
                const newBoard = [...board];
                newBoard[idx] = joueur;
                const result = minimax(newBoard, joueur === 1 ? 0 : 1);
                moves.push({ idx, score: result.score });
            });
            return joueur === 1
                ? moves.reduce((a, b) => a.score > b.score ? a : b)
                : moves.reduce((a, b) => a.score < b.score ? a : b);
        }

        function verifierGagnantBoard(board) {
            for (const [a, b, c] of COMBOS_3) {
                if (board[a] !== null && board[a] === board[b] && board[a] === board[c]) return board[a];
            }
            return null;
        }
    </script>
</body>
</html>
