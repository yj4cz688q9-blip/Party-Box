<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "5a950e67-e354-43dc-86bc-76a05197d6e0",
    });
  });
</script>

    <link rel="apple-touch-icon" href="F1CE1FF7-8FC2-440D-8100-49C689144B20.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Box</title>
    <link rel="icon" type="image/png" href="F1CE1FF7-8FC2-440D-8100-49C689144B20.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .logo {
            width: 140px;
            border-radius: 28px;
            animation: spin 2s linear infinite;
            margin-bottom: 25px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .titre {
            font-size: 28px;
            font-weight: bold;
            color: #00e5cc;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        .loading-txt {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            transition: opacity 0.3s;
        }
        .barre-bg {
            width: 200px;
            height: 4px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
        }
        .barre-fill {
            height: 100%;
            background: #00e5cc;
            border-radius: 2px;
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <img class="logo" src="F1CE1FF7-8FC2-440D-8100-49C689144B20.png">
    <div class="titre">PARTY BOX</div>
    <div class="loading-txt" id="loading-txt">Verifying files...</div>
    <div class="barre-bg">
        <div class="barre-fill" id="barre"></div>
    </div>

    <script>
        const etapes = [
            { txt: 'Verifying files...', pct: 20 },
            { txt: 'Searching for updates...', pct: 45 },
            { txt: 'Loading resources...', pct: 70 },
            { txt: 'Almost ready...', pct: 90 },
            { txt: 'Ready! 🎉', pct: 100 }
        ];

        let i = 0;
        const txt = document.getElementById('loading-txt');
        const barre = document.getElementById('barre');

        function nextEtape() {
            if (i >= etapes.length) {
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 500);
                return;
            }
            txt.textContent = etapes[i].txt;
            barre.style.width = etapes[i].pct + '%';
            i++;
            setTimeout(nextEtape, 600);
        }

        nextEtape();
    </script>
</body>
</html>
